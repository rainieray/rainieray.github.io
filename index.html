<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九谕传说 · Ennead Realms</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #0d0e12;
            color: #e8e6e3;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== 头部 ===== */
        .hero {
            text-align: center;
            padding: 2rem 1rem 2rem;
            border-bottom: 1px solid #2a2c33;
            margin-bottom: 2.5rem;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #f2e9d0;
            text-shadow: 0 0 12px rgba(218, 192, 152, 0.2);
        }

        .hero h1 span {
            font-weight: 600;
            color: #d8c8a8;
        }

        .hero .sub {
            font-size: 1.1rem;
            color: #9a9a9a;
            margin-top: 0.5rem;
            letter-spacing: 2px;
        }

        .hero .sub i {
            margin: 0 0.5rem;
            color: #b8a788;
        }

        /* 世界简介 */
        .world-intro {
            max-width: 780px;
            margin: 1.2rem auto 0;
            padding: 0 1rem;
        }

        .world-intro p {
            font-size: 1.05rem;
            color: #d0cbc0;
            line-height: 1.8;
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem 1.6rem;
            border-radius: 16px;
            border: 1px solid #2a2e38;
            letter-spacing: 0.3px;
        }

        /* ===== 目录导航 ===== */
        .toc {
            background: #14181f;
            border-radius: 16px;
            padding: 1.2rem 1.8rem;
            margin: 1.5rem 0 0rem;
            border: 1px solid #2a2e38;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem 1.5rem;
        }

        .toc a {
            color: #d0cbc0;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.4rem 0.2rem;
            border-bottom: 2px solid transparent;
            transition: all 0.25s;
            letter-spacing: 0.5px;
        }

        .toc a:hover {
            color: #f2e9d0;
            border-bottom-color: #b8a788;
        }

        .toc a i {
            margin-right: 0.4rem;
            color: #b8a788;
        }

        /* 响应式 */
        @media (max-width: 700px) {
            .hero h1 { font-size: 2.2rem; }
            .toc { gap: 0.5rem 1rem; }
            .toc a { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ========================================================= -->
    <!-- 头部：世界名称 + 子标题 + 世界简介 -->
    <!-- ========================================================= -->
    <div class="hero">
        <h1>九谕传说 <span>Ennead Realms</span></h1>
        <div class="sub">
            <i class="fas fa-scroll"></i> 七大种族 · 九块大陆 · 八大圣器 <i class="fas fa-dragon"></i>
        </div>
        <div class="world-intro">
            <p>
                这是一个由七个种族和九块大陆构成的神秘之地。
                文明从大灾变中演化，光明魔法与黑暗魔法相互对立，
                多种族之间不停地发展与冲突。
                相传，创世神创造了这个世界，而在这片大陆的反面，还存在一个危险的世界。
            </p>
        </div>
    </div>

    <!-- ========================================================= -->
    <!-- 目录导航（点击跳转到对应板块） -->
    <!-- ========================================================= -->
    <div class="toc">
        <a href="#section-overview"><i class="fas fa-globe"></i> 世界观概述</a>
        <a href="#section-races"><i class="fas fa-users"></i> 种族简介</a>
        <a href="#section-continents"><i class="fas fa-map"></i> 大陆介绍</a>
        <a href="#section-artifacts"><i class="fas fa-gem"></i> 圣器预言</a>
        <a href="#section-characters"><i class="fas fa-user-astronaut"></i> 角色简介</a>
        <a href="#section-story"><i class="fas fa-book-open"></i> 正文</a>
    </div>

</div>
</body>
</html>
